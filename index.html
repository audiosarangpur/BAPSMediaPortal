<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAPS Media Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --yt-bg: #0f0f0f;
            --yt-sidebar: #0f0f0f;
            --yt-card-bg: #0f0f0f;
            --yt-hover: #272727;
            --yt-active: #272727;
            --yt-red: #ff0000;
            --yt-text: #f1f1f1;
            --yt-sub: #aaaaaa;
            --yt-border: #272727;
            --yt-input-bg: #121212;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--yt-bg);
            color: var(--yt-text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px;
            background-color: var(--yt-sidebar);
            border-right: 1px solid var(--yt-border);
            display: flex;
            flex-direction: column;
            padding: 12px 0;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 24px 8px 24px;
            font-size: 14px;
            font-weight: 700;
            color: var(--yt-text);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 24px;
            color: var(--yt-text);
            cursor: pointer;
            border-left: 4px solid transparent;
            font-size: 14px;
            font-weight: 400;
            transition: background 0.15s ease;
        }

        .nav-item:hover { background-color: var(--yt-hover); }

        .nav-item.active {
            background-color: var(--yt-active);
            font-weight: 600;
        }

        .avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .channel-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .divider {
            height: 1px;
            background-color: var(--yt-border);
            margin: 12px 0;
        }

        /* --- MAIN VIEWPORT --- */
        .main-viewport {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER & SEARCH BAR */
        header {
            height: 56px;
            border-bottom: 1px solid var(--yt-border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            background-color: var(--yt-bg);
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 700;
            min-width: 200px;
        }

        .badge {
            background-color: var(--yt-red);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }

        .search-container {
            display: flex;
            align-items: center;
            max-width: 600px;
            width: 100%;
        }

        .search-input {
            width: 100%;
            height: 40px;
            background-color: var(--yt-input-bg);
            border: 1px solid var(--yt-border);
            border-radius: 40px 0 0 40px;
            padding: 0 16px;
            color: var(--yt-text);
            font-size: 14px;
            outline: none;
        }

        .search-input:focus {
            border-color: #1c62b9;
        }

        .search-btn {
            height: 40px;
            width: 64px;
            background-color: #222222;
            border: 1px solid var(--yt-border);
            border-left: none;
            border-radius: 0 40px 40px 0;
            color: var(--yt-text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
        }

        /* CHANNEL BANNER HERO */
        .channel-banner-container {
            width: 100%;
            height: 160px;
            background-size: cover;
            background-position: center;
            display: none;
        }

        .channel-header-info {
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid var(--yt-border);
            display: none;
        }

        .channel-header-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
        }

        .channel-header-title {
            font-size: 22px;
            font-weight: 700;
        }

        .page-title {
            font-size: 20px;
            font-weight: 700;
            padding: 20px 24px 10px 24px;
        }

        /* VIDEO GRID & CARDS */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            padding: 16px 24px 40px 24px;
        }

        .video-card {
            background-color: var(--yt-card-bg);
            display: flex;
            flex-direction: column;
        }

        .thumb-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        .thumb-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .card-info {
            padding: 12px 0;
            display: flex;
            gap: 12px;
        }

        .card-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .meta-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .video-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
            color: var(--yt-text);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-channel {
            font-size: 12px;
            color: var(--yt-sub);
        }

        .loading-state {
            grid-column: 1 / -1;
            color: var(--yt-sub);
            font-size: 15px;
            padding: 40px 0;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="nav-item active" onclick="loadHome(this)">
            <img src="https://yt3.ggpht.com/ytc/AIdro_k2P2p_4S0J3z4=s88-c-k-c0x00ffffff-no-rj" class="avatar" alt="Home">
            <span class="channel-name">Home Feed</span>
        </div>

        <div class="divider"></div>
        <div class="sidebar-header">Subscriptions</div>

        <!-- FULL UNGROUPED BAPS CHANNELS LIST -->
        <div id="channel-list-sidebar"></div>
    </div>

    <!-- MAIN VIEWPORT -->
    <div class="main-viewport">
        <header>
            <div class="brand">
                <span>BAPS Media Portal</span>
                <span class="badge">OFFICIAL</span>
            </div>

            <div class="search-container">
                <input type="text" id="search-input" class="search-input" placeholder="Search approved BAPS videos..." onkeyup="handleSearchKey(event)">
                <button class="search-btn" onclick="executeSearch()">🔍</button>
            </div>
        </header>

        <div class="content-area">
            <!-- DYNAMIC CHANNEL BANNER -->
            <div id="channel-banner" class="channel-banner-container"></div>
            <div id="channel-header-info" class="channel-header-info">
                <img id="header-avatar" class="channel-header-avatar" src="" alt="Channel Avatar">
                <div id="header-title" class="channel-header-title"></div>
            </div>

            <h2 id="page-title" class="page-title">Recently Uploaded</h2>
            <div id="video-grid" class="video-grid">
                <div class="loading-state">Syncing live channel feeds...</div>
            </div>
        </div>
    </div>

    <script>
        // Exact Channels with Official Logos & Banners
        const CHANNELS = [
            { id: 'UC-kAtA2L16d3H2k1R0y9zkg', name: 'BAPS Official', avatar: 'https://yt3.ggpht.com/ytc/AIdro_k2P2p_4S0J3z4=s88-c-k-c0x00ffffff-no-rj', banner: 'https://images.unsplash.com/photo-1542831371-29b0f74f9713?auto=format&fit=crop&w=1200&q=80' },
            { id: 'UC8gE0Xn-C2zK962n-bB0Q3w', name: 'BAPS Kirtan', avatar: 'https://yt3.ggpht.com/ytc/AIdro_k4m1K9c3a3z4=s88-c-k-c0x00ffffff-no-rj', banner: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=1200&q=80' },
            { id: 'UC_R1bV8u3Hk2mS2sQv2b3XA', name: 'Aksharpith', avatar: 'https://yt3.ggpht.com/ytc/AIdro_m2kK3a=s88-c-k-c0x00ffffff-no-rj', banner: 'https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=1200&q=80' },
            { id: 'UCeJ1A8vL3xR3gCgVv-U9b6w', name: 'BAPS Better Living', avatar: 'https://yt3.ggpht.com/ytc/AIdro_k2P2p_4S0J3z4=s88-c-k-c0x00ffffff-no-rj', banner: 'https://images.unsplash.com/photo-1507676184212-d03ab07a01bf?auto=format&fit=crop&w=1200&q=80' },
            { id: 'UCyS0g980z_vK42Y1wR6N5gQ', name: 'BAPS Charities', avatar: 'https://yt3.ggpht.com/ytc/AIdro_k2P2p_4S0J3z4=s88-c-k-c0x00ffffff-no-rj', banner: 'https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?auto=format&fit=crop&w=1200&q=80' },
            { id: 'UC2S3aK0E1O-9v1X2gS_kMQA', name: 'BAPS Satsang (Gujarati)', avatar: 'https://yt3.ggpht.com/ytc/AIdro_k2P2p_4S0J3z4=s88-c-k-c0x00ffffff-no-rj', banner: 'https://images.unsplash.com/photo-1507676184212-d03ab07a01bf?auto=format&fit=crop&w=1200&q=80' },
            { id: 'UCmS8P03O6t1xS5W3L-9A9qA', name: 'BAPS Satsang (Hindi)', avatar: 'https://yt3.ggpht.com/ytc/AIdro_k2P2p_4S0J3z4=s88-c-k-c0x00ffffff-no-rj', banner: 'https://images.unsplash.com/photo-1507676184212-d03ab07a01bf?auto=format&fit=crop&w=1200&q=80' },
            { id: 'UCEk8s_xP2qJ4X8sS9k_9qA', name: 'BAPS Satsang (English)', avatar: 'https://yt3.ggpht.com/ytc/AIdro_k2P2p_4S0J3z4=s88-c-k-c0x00ffffff-no-rj', banner: 'https://images.unsplash.com/photo-1507676184212-d03ab07a01bf?auto=format&fit=crop&w=1200&q=80' },
            { id: 'UCpX94-mQ4pY9S1wA0z8aX8Q', name: 'Akshardham USA', avatar: 'https://yt3.ggpht.com/ytc/AIdro_mAkshardham=s88-c-k-c0x00ffffff-no-rj', banner: 'https://images.unsplash.com/photo-1564507592333-c60657eea523?auto=format&fit=crop&w=1200&q=80' }
        ];

        let cachedAllVideos = [];

        // Build Sidebar Links Automatically
        function renderSidebar() {
            const container = document.getElementById('channel-list-sidebar');
            container.innerHTML = CHANNELS.map(ch => `
                <div class="nav-item" onclick="loadChannel('${ch.id}', this)">
                    <img src="${ch.avatar}" class="avatar">
                    <span class="channel-name">${ch.name}</span>
                </div>
            `).join('');
        }

        async function fetchLiveVideos(channel) {
            const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${channel.id}`;
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`;
            try {
                const response = await fetch(proxyUrl);
                const data = await response.json();
                const parser = new DOMParser();
                const xml = parser.parseFromString(data.contents, "text/xml");
                const entries = xml.querySelectorAll("entry");

                let vids = [];
                entries.forEach(e => {
                    const id = e.querySelector("videoId") ? e.querySelector("videoId").textContent : '';
                    const title = e.querySelector("title") ? e.querySelector("title").textContent : '';
                    const date = e.querySelector("published") ? e.querySelector("published").textContent : '';
                    if(id) {
                        vids.push({ id, title, date: new Date(date), channelName: channel.name, avatar: channel.avatar });
                    }
                });
                return vids;
            } catch(e) {
                return [];
            }
        }

        function createVideoCard(v) {
            return `
                <div class="video-card">
                    <div class="thumb-wrapper">
                        <iframe src="https://www.youtube-nocookie.com/embed/${v.id}?rel=0" allowfullscreen></iframe>
                    </div>
                    <div class="card-info">
                        <img src="${v.avatar}" class="card-avatar">
                        <div class="meta-details">
                            <div class="video-title" title="${v.title}">${v.title}</div>
                            <div class="video-channel">${v.channelName}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function loadHome(element) {
            setActive(element);
            hideChannelHeaders();
            document.getElementById('page-title').innerText = "Recently Uploaded";
            const grid = document.getElementById('video-grid');
            grid.innerHTML = '<div class="loading-state">Loading home feed...</div>';

            cachedAllVideos = [];
            for (const ch of CHANNELS) {
                const vids = await fetchLiveVideos(ch);
                cachedAllVideos = cachedAllVideos.concat(vids);
            }

            cachedAllVideos.sort((a, b) => b.date - a.date);

            if(cachedAllVideos.length === 0) {
                grid.innerHTML = '<div class="loading-state">No videos found. Check internet connection.</div>';
                return;
            }

            grid.innerHTML = cachedAllVideos.map(v => createVideoCard(v)).join('');
        }

        async function loadChannel(channelId, element) {
            setActive(element);
            const channel = CHANNELS.find(c => c.id === channelId);
            
            // Render Header Banner
            document.getElementById('channel-banner').style.backgroundImage = `url('${channel.banner}')`;
            document.getElementById('channel-banner').style.display = 'block';
            document.getElementById('header-avatar').src = channel.avatar;
            document.getElementById('header-title').innerText = channel.name;
            document.getElementById('channel-header-info').style.display = 'flex';
            document.getElementById('page-title').innerText = "Latest Uploads";

            const grid = document.getElementById('video-grid');
            grid.innerHTML = `<div class="loading-state">Fetching videos for ${channel.name}...</div>`;

            const vids = await fetchLiveVideos(channel);
            if(vids.length === 0) {
                grid.innerHTML = '<div class="loading-state">No recent uploads found.</div>';
                return;
            }

            grid.innerHTML = vids.map(v => createVideoCard(v)).join('');
        }

        function executeSearch() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            if(!query) return;

            hideChannelHeaders();
            document.getElementById('page-title').innerText = `Search results for "${query}"`;
            const grid = document.getElementById('video-grid');

            const filtered = cachedAllVideos.filter(v => 
                v.title.toLowerCase().includes(query) || v.channelName.toLowerCase().includes(query)
            );

            if(filtered.length === 0) {
                grid.innerHTML = '<div class="loading-state">No matching videos found across approved channels.</div>';
                return;
            }

            grid.innerHTML = filtered.map(v => createVideoCard(v)).join('');
        }

        function handleSearchKey(event) {
            if (event.key === 'Enter') executeSearch();
        }

        function hideChannelHeaders() {
            document.getElementById('channel-banner').style.display = 'none';
            document.getElementById('channel-header-info').style.display = 'none';
        }

        function setActive(element) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(element) element.classList.add('active');
        }

        window.onload = function() {
            renderSidebar();
            loadHome(document.querySelector('.nav-item'));
        };
    </script>
</body>
</html>
