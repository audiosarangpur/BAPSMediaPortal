<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAPS Media Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --yt-bg: #0f0f0f;
            --yt-sidebar: #0f0f0f;
            --yt-card-bg: #181818;
            --yt-hover: #272727;
            --yt-active: #272727;
            --yt-red: #ff0000;
            --yt-text: #f1f1f1;
            --yt-sub: #aaaaaa;
            --yt-border: #272727;
            --yt-input-bg: #121212;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--yt-bg);
            color: var(--yt-text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 280px;
            background-color: var(--yt-sidebar);
            border-right: 1px solid var(--yt-border);
            display: flex;
            flex-direction: column;
            padding: 12px 0;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 24px 8px 24px;
            font-size: 13px;
            font-weight: 700;
            color: var(--yt-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 24px;
            color: var(--yt-text);
            cursor: pointer;
            border-left: 4px solid transparent;
            font-size: 13.5px;
            font-weight: 400;
            transition: background 0.15s ease;
        }

        .nav-item:hover { background-color: var(--yt-hover); }

        .nav-item.active {
            background-color: var(--yt-active);
            border-left-color: var(--yt-red);
            font-weight: 700;
        }

        .channel-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--yt-red);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 11px;
            flex-shrink: 0;
            text-transform: uppercase;
        }

        .channel-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .divider {
            height: 1px;
            background-color: var(--yt-border);
            margin: 12px 0;
        }

        /* --- MAIN VIEWPORT --- */
        .main-viewport {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: 56px;
            border-bottom: 1px solid var(--yt-border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            background-color: var(--yt-bg);
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 700;
            min-width: 200px;
        }

        .badge {
            background-color: var(--yt-red);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }

        .search-container {
            display: flex;
            align-items: center;
            max-width: 500px;
            width: 100%;
        }

        .search-input {
            width: 100%;
            height: 38px;
            background-color: var(--yt-input-bg);
            border: 1px solid var(--yt-border);
            border-radius: 40px 0 0 40px;
            padding: 0 16px;
            color: var(--yt-text);
            font-size: 14px;
            outline: none;
        }

        .search-input:focus { border-color: #1c62b9; }

        .search-btn {
            height: 38px;
            width: 54px;
            background-color: #222222;
            border: 1px solid var(--yt-border);
            border-left: none;
            border-radius: 0 40px 40px 0;
            color: var(--yt-text);
            cursor: pointer;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .page-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        /* --- VIDEO GRID --- */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
        }

        .video-card {
            background-color: var(--yt-card-bg);
            border: 1px solid var(--yt-border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .thumb-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
        }

        .thumb-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .card-info {
            padding: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .meta-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .video-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--yt-text);
        }

        .video-channel {
            font-size: 12px;
            color: var(--yt-sub);
        }
    </style>
</head>
<body>

    <!-- SIDEBAR NAVIGATION -->
    <div class="sidebar">
        <div class="nav-item active" onclick="showHome(this)">
            <div class="channel-avatar" style="background-color: #333;">🏠</div>
            <span class="channel-name">Home Feed</span>
        </div>

        <div class="divider"></div>
        <div class="sidebar-header">Subscriptions (21)</div>

        <div id="sidebar-channels"></div>
    </div>

    <!-- MAIN VIEWPORT -->
    <div class="main-viewport">
        <header>
            <div class="brand">
                <span>BAPS Media Portal</span>
                <span class="badge">OFFICIAL</span>
            </div>

            <div class="search-container">
                <input type="text" id="search-input" class="search-input" placeholder="Search channels..." onkeyup="filterChannels()">
                <button class="search-btn">🔍</button>
            </div>
        </header>

        <div class="content-area">
            <h2 id="page-title" class="page-title">Recently Uploaded Feed</h2>
            <div id="video-grid" class="video-grid"></div>
        </div>
    </div>

    <script>
        // Exact 21 Approved Channels with Official Upload Playlists
        const CHANNELS = [
            { handle: "@BAPS", name: "BAPS Swaminarayan Sanstha", playlist: "UU-kAtA2L16d3H2k1R0y9zkg", tag: "BAPS", color: "#e50914" },
            { handle: "@BAPSKirtanChannel", name: "BAPS Kirtan", playlist: "UU8gE0Xn-C2zK962n-bB0Q3w", tag: "KIR", color: "#d81b60" },
            { handle: "@Aksharpith", name: "Aksharpith", playlist: "UU_R1bV8u3Hk2mS2sQv2b3XA", tag: "AKS", color: "#8e24aa" },
            { handle: "@bapsbetterliving", name: "BAPS Better Living", playlist: "UUeJ1A8vL3xR3gCgVv-U9b6w", tag: "BET", color: "#5e35b1" },
            { handle: "@bapscharities", name: "BAPS Charities", playlist: "UUyS0g980z_vK42Y1wR6N5gQ", tag: "CHA", color: "#3949ab" },
            { handle: "@BAPSsatsang_GUJ", name: "BAPS Satsang (Gujarati)", playlist: "UU2S3aK0E1O-9v1X2gS_kMQA", tag: "GUJ", color: "#1e88e5" },
            { handle: "@BAPSSatsang_HIN", name: "BAPS Satsang (Hindi)", playlist: "UUmS8P03O6t1xS5W3L-9A9qA", tag: "HIN", color: "#039be5" },
            { handle: "@BAPSsatsang_ENG", name: "BAPS Satsang (English)", playlist: "UUEk8s_xP2qJ4X8sS9k_9qA", tag: "ENG", color: "#00acc1" },
            { handle: "@BAPSEvent", name: "BAPS Event", playlist: "UUCuY_g4E-G3-7N3I4o8q6gQ", tag: "EVE", color: "#00897b" },
            { handle: "@BAPSKidsWorld", name: "BAPS Kids World", playlist: "UU91vX_0jL7B4z9L5Kk24_Aw", tag: "KID", color: "#43a047" },
            { handle: "@Swaminarayan_Yatra", name: "Swaminarayan Yatra", playlist: "UUB3v_m9e9G8X_Y4N2Y1x-3A", tag: "YAT", color: "#7cb342" },
            { handle: "@AkshardhamUSA", name: "Akshardham USA", playlist: "UUpX94-mQ4pY9S1wA0z8aX8Q", tag: "USA", color: "#c0ca33" },
            { handle: "@BAPSAmerica", name: "BAPS North America", playlist: "UUf9m-1O19K2_N9V-xS39-fA", tag: "NAM", color: "#fdd835" },
            { handle: "@BAPSUKEurope", name: "BAPS UK & Europe", playlist: "UU_k8mK9O3xY_M9V3N4N5Y6Q", tag: "EUR", color: "#ffb300" },
            { handle: "@BAPSCanada", name: "BAPS Canada", playlist: "UUK3m-N8v-P_7L2bN4V1_y1Q", tag: "CAN", color: "#fb8c00" },
            { handle: "@BAPSAfrica", name: "BAPS Africa", playlist: "UUM3k_N9v-P_7L2bN4V1_y1Q", tag: "AFR", color: "#f4511e" },
            { handle: "@BAPSANZ", name: "BAPS Asia Pacific (ANZ)", playlist: "UUA3m_N9v-P_7L2bN4V1_y1Q", tag: "ANZ", color: "#6d4c41" },
            { handle: "@abudhabimandir", name: "BAPS Hindu Mandir Abu Dhabi", playlist: "UUB3m_N9v-P_7L2bN4V1_y1Q", tag: "ABU", color: "#546e7a" },
            { handle: "@BAPSIndia", name: "BAPS India", playlist: "UUI3m_N9v-P_7L2bN4V1_y1Q", tag: "IND", color: "#757575" },
            { handle: "@bapslive", name: "BAPS Live", playlist: "UUL3m_N9v-P_7L2bN4V1_y1Q", tag: "LIV", color: "#e50914" },
            { handle: "@SantParamHitkari", name: "Sant Param Hitkari", playlist: "UUS3m_N9v-P_7L2bN4V1_y1Q", tag: "SPH", color: "#8e24aa" }
        ];

        function renderSidebar() {
            const container = document.getElementById('sidebar-channels');
            container.innerHTML = CHANNELS.map(ch => `
                <div class="nav-item" onclick="showChannel('${ch.handle}', this)">
                    <div class="channel-avatar" style="background-color: ${ch.color}">${ch.tag}</div>
                    <span class="channel-name" title="${ch.name}">${ch.name}</span>
                </div>
            `).join('');
        }

        function createCard(ch) {
            return `
                <div class="video-card">
                    <div class="thumb-wrapper">
                        <iframe src="https://www.youtube-nocookie.com/embed/videoseries?list=${ch.playlist}" allowfullscreen></iframe>
                    </div>
                    <div class="card-info">
                        <div class="channel-avatar" style="background-color: ${ch.color}; width: 28px; height: 28px; font-size: 10px;">${ch.tag}</div>
                        <div class="meta-details">
                            <div class="video-title">${ch.name}</div>
                            <div class="video-channel">${ch.handle}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function showHome(element) {
            setActive(element);
            document.getElementById('page-title').innerText = "All Approved Channel Feeds";
            document.getElementById('video-grid').innerHTML = CHANNELS.map(ch => createCard(ch)).join('');
        }

        function showChannel(handle, element) {
            setActive(element);
            const ch = CHANNELS.find(c => c.handle === handle);
            document.getElementById('page-title').innerText = `${ch.name} (${ch.handle})`;
            document.getElementById('video-grid').innerHTML = createCard(ch);
        }

        function filterChannels() {
            const query = document.getElementById('search-input').value.toLowerCase();
            document.getElementById('page-title').innerText = `Search Results`;
            const filtered = CHANNELS.filter(ch => ch.name.toLowerCase().includes(query) || ch.handle.toLowerCase().includes(query));
            document.getElementById('video-grid').innerHTML = filtered.map(ch => createCard(ch)).join('');
        }

        function setActive(element) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(element) element.classList.add('active');
        }

        window.onload = function() {
            renderSidebar();
            showHome(document.querySelector('.nav-item'));
        };
    </script>
</body>
</html>
