<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAPS Media Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --yt-bg: #0f0f0f;
            --yt-sidebar: #0f0f0f;
            --yt-card-bg: #1f1f1f;
            --yt-hover: #272727;
            --yt-active: #383838;
            --yt-red: #ff0000;
            --yt-text: #f1f1f1;
            --yt-sub: #aaaaaa;
            --yt-border: #272727;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--yt-bg);
            color: var(--yt-text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px;
            background-color: var(--yt-sidebar);
            border-right: 1px solid var(--yt-border);
            display: flex;
            flex-direction: column;
            padding: 12px 0;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 24px 8px 24px;
            font-size: 12px;
            font-weight: 700;
            color: var(--yt-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 24px;
            color: var(--yt-text);
            cursor: pointer;
            border-left: 4px solid transparent;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.15s ease;
        }

        .nav-item:hover { background-color: var(--yt-hover); }

        .nav-item.active {
            background-color: var(--yt-active);
            border-left-color: var(--yt-red);
            font-weight: 700;
        }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            background: #272727;
            flex-shrink: 0;
        }

        .channel-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .divider {
            height: 1px;
            background-color: var(--yt-border);
            margin: 8px 0;
        }

        /* --- MAIN VIEWPORT --- */
        .main-viewport {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: 56px;
            border-bottom: 1px solid var(--yt-border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            background-color: var(--yt-bg);
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
        }

        .badge {
            background-color: var(--yt-red);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }

        .content-area {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }

        .page-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        /* --- VIDEO GRID --- */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .video-card {
            background-color: var(--yt-card-bg);
            border: 1px solid var(--yt-border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .thumb-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
        }

        .thumb-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .card-info {
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .video-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
            color: var(--yt-text);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-channel {
            font-size: 12px;
            color: var(--yt-sub);
        }

        .loading-state {
            grid-column: 1 / -1;
            color: var(--yt-sub);
            font-size: 15px;
            padding: 40px 0;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR NAVIGATION -->
    <div class="sidebar">
        <div class="nav-item active" onclick="loadHome(this)">
            <img src="https://yt3.ggpht.com/ytc/AIdro_k2P2p_4S0J3z4=s88-c-k-c0x00ffffff-no-rj" class="avatar" alt="Home">
            <span class="channel-name">Home Feed</span>
        </div>

        <div class="divider"></div>
        <div class="sidebar-header">Subscriptions</div>

        <!-- INDIVIDUAL UNGROUPED BAPS CHANNELS -->
        <div class="nav-item" onclick="loadChannel('UC-kAtA2L16d3H2k1R0y9zkg', 'BAPS Swaminarayan Sanstha', this)">
            <img src="https://yt3.ggpht.com/ytc/AIdro_k2P2p_4S0J3z4=s88-c-k-c0x00ffffff-no-rj" class="avatar">
            <span class="channel-name">BAPS Official</span>
        </div>
        <div class="nav-item" onclick="loadChannel('UC8gE0Xn-C2zK962n-bB0Q3w', 'BAPS Kirtan', this)">
            <img src="https://yt3.ggpht.com/ytc/AIdro_k4m1K9c3a3z4=s88-c-k-c0x00ffffff-no-rj" class="avatar">
            <span class="channel-name">BAPS Kirtan</span>
        </div>
        <div class="nav-item" onclick="loadChannel('UC_R1bV8u3Hk2mS2sQv2b3XA', 'Aksharpith', this)">
            <img src="https://yt3.ggpht.com/ytc/AIdro_m2kK3a=s88-c-k-c0x00ffffff-no-rj" class="avatar">
            <span class="channel-name">Aksharpith</span>
        </div>
        <div class="nav-item" onclick="loadChannel('UC2S3aK0E1O-9v1X2gS_kMQA', 'BAPS Satsang (Gujarati)', this)">
            <img src="https://yt3.ggpht.com/ytc/AIdro_k2P2p_4S0J3z4=s88-c-k-c0x00ffffff-no-rj" class="avatar">
            <span class="channel-name">BAPS Satsang (Gujarati)</span>
        </div>
        <div class="nav-item" onclick="loadChannel('UCmS8P03O6t1xS5W3L-9A9qA', 'BAPS Satsang (Hindi)', this)">
            <img src="https://yt3.ggpht.com/ytc/AIdro_k2P2p_4S0J3z4=s88-c-k-c0x00ffffff-no-rj" class="avatar">
            <span class="channel-name">BAPS Satsang (Hindi)</span>
        </div>
        <div class="nav-item" onclick="loadChannel('UCEk8s_xP2qJ4X8sS9k_9qA', 'BAPS Satsang (English)', this)">
            <img src="https://yt3.ggpht.com/ytc/AIdro_k2P2p_4S0J3z4=s88-c-k-c0x00ffffff-no-rj" class="avatar">
            <span class="channel-name">BAPS Satsang (English)</span>
        </div>
        <div class="nav-item" onclick="loadChannel('UCpX94-mQ4pY9S1wA0z8aX8Q', 'Akshardham USA', this)">
            <img src="https://yt3.ggpht.com/ytc/AIdro_mAkshardham=s88-c-k-c0x00ffffff-no-rj" class="avatar">
            <span class="channel-name">Akshardham USA</span>
        </div>
    </div>

    <!-- MAIN VIEWPORT -->
    <div class="main-viewport">
        <header>
            <div class="brand">
                <span>BAPS Media Portal</span>
                <span class="badge">OFFICIAL</span>
            </div>
        </header>

        <div class="content-area">
            <h2 id="page-title" class="page-title">Recently Uploaded</h2>
            <div id="video-grid" class="video-grid">
                <div class="loading-state">Loading live feeds...</div>
            </div>
        </div>
    </div>

    <script>
        const APPROVED_CHANNELS = [
            { id: 'UC-kAtA2L16d3H2k1R0y9zkg', name: 'BAPS Official' },
            { id: 'UC8gE0Xn-C2zK962n-bB0Q3w', name: 'BAPS Kirtan' },
            { id: 'UC2S3aK0E1O-9v1X2gS_kMQA', name: 'BAPS Satsang (Gujarati)' },
            { id: 'UC_R1bV8u3Hk2mS2sQv2b3XA', name: 'Aksharpith' }
        ];

        // Fetch YouTube channel RSS converted via public CORS API
        async function fetchLiveChannelVideos(channelId) {
            const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`;
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`;
            try {
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                // Parse XML Feed
                const parser = new DOMParser();
                const xml = parser.parseFromString(data.contents, "text/xml");
                const entries = xml.querySelectorAll("entry");

                let videos = [];
                entries.forEach(entry => {
                    const videoId = entry.querySelector("videoId") ? entry.querySelector("videoId").textContent : '';
                    const title = entry.querySelector("title") ? entry.querySelector("title").textContent : '';
                    const published = entry.querySelector("published") ? entry.querySelector("published").textContent : '';
                    if (videoId) {
                        videos.push({
                            id: videoId,
                            title: title,
                            published: new Date(published)
                        });
                    }
                });
                return videos;
            } catch (e) {
                return [];
            }
        }

        function createVideoCard(videoId, title, channelName) {
            return `
                <div class="video-card">
                    <div class="thumb-wrapper">
                        <iframe 
                            src="https://www.youtube-nocookie.com/embed/${videoId}?rel=0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                        </iframe>
                    </div>
                    <div class="card-info">
                        <div class="video-title" title="${title}">${title}</div>
                        <div class="video-channel">${channelName}</div>
                    </div>
                </div>
            `;
        }

        // Home View: Aggregates latest uploads across channels
        async function loadHome(element) {
            setActive(element);
            document.getElementById('page-title').innerText = "Recently Uploaded";
            const grid = document.getElementById('video-grid');
            grid.innerHTML = '<div class="loading-state">Syncing live videos from approved channels...</div>';

            let combinedFeed = [];
            for (const ch of APPROVED_CHANNELS) {
                const vids = await fetchLiveChannelVideos(ch.id);
                vids.slice(0, 2).forEach(v => {
                    combinedFeed.push({
                        id: v.id,
                        title: v.title,
                        channel: ch.name,
                        date: v.published
                    });
                });
            }

            combinedFeed.sort((a, b) => b.date - a.date);

            if (combinedFeed.length === 0) {
                grid.innerHTML = '<div class="loading-state">Unable to load live feeds. Verify internet connection.</div>';
                return;
            }

            grid.innerHTML = combinedFeed.map(v => createVideoCard(v.id, v.title, v.channel)).join('');
        }

        // Single Channel View
        async function loadChannel(channelId, channelName, element) {
            setActive(element);
            document.getElementById('page-title').innerText = channelName;
            const grid = document.getElementById('video-grid');
            grid.innerHTML = `<div class="loading-state">Fetching recent uploads for ${channelName}...</div>`;

            const videos = await fetchLiveChannelVideos(channelId);

            if (videos.length === 0) {
                grid.innerHTML = `<div class="loading-state">No recent uploads found for ${channelName}.</div>`;
                return;
            }

            grid.innerHTML = videos.map(v => createVideoCard(v.id, v.title, channelName)).join('');
        }

        function setActive(element) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if (element) element.classList.add('active');
        }

        // Auto-run on launch
        window.onload = function() {
            loadHome(document.querySelector('.nav-item'));
        };
    </script>
</body>
</html>
