<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAPS Media Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Link to UI Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- SIDEBAR NAVIGATION -->
    <div class="sidebar">
        <div class="nav-item active" onclick="showHome(this)">
            <div class="channel-avatar" style="background-color: #333;">🏠</div>
            <span class="channel-name">Home Feed</span>
        </div>

        <div class="divider"></div>
        <div class="sidebar-header">Subscriptions (21)</div>

        <div id="sidebar-channels"></div>
    </div>

    <!-- MAIN VIEWPORT -->
    <div class="main-viewport">
        <header>
            <div class="brand">
                <span>BAPS Media Portal</span>
                <span class="badge">OFFICIAL</span>
            </div>

            <div class="search-container">
                <input type="text" id="search-input" class="search-input" placeholder="Search channels..." onkeyup="filterChannels()">
                <button class="search-btn">🔍</button>
            </div>
        </header>

        <div class="content-area">
            <h2 id="page-title" class="page-title">Recently Uploaded Feed</h2>
            <div id="video-grid" class="video-grid"></div>
        </div>
    </div>

    <!-- Link to Logic JavaScript File -->
    <script src="app.js"></script>
</body>
</html>
