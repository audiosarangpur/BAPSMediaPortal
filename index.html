<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAPS Media Portal</title>
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --sidebar-bg: #0f0f0f;
            --card-bg: #1f1f1f;
            --hover-bg: #272727;
            --active-bg: #383838;
            --yt-red: #ff0000;
            --text-main: #f1f1f1;
            --text-sub: #aaaaaa;
            --border: #272727;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR NAVIGATION --- */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 12px 0;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar-section-title {
            padding: 12px 24px 6px 24px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 24px;
            color: var(--text-main);
            cursor: pointer;
            border-left: 4px solid transparent;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.15s ease;
        }

        .nav-item:hover { background-color: var(--hover-bg); }

        .nav-item.active {
            background-color: var(--active-bg);
            border-left-color: var(--yt-red);
            font-weight: 700;
        }

        .channel-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            background: #333;
            flex-shrink: 0;
        }

        .channel-label {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .divider {
            height: 1px;
            background-color: var(--border);
            margin: 8px 0;
        }

        /* --- MAIN CONTENT AREA --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: 56px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            background-color: var(--bg-dark);
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 700;
        }

        .badge {
            background-color: var(--yt-red);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }

        .viewport-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }

        .page-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* --- VIDEO GRID & CARDS --- */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
        }

        .video-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .video-embed-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
        }

        .video-embed-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-details {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .video-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
            color: var(--text-main);
        }

        .video-channel {
            font-size: 12px;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="nav-item active" onclick="showHome(this)">
            <img src="https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?auto=format&fit=crop&w=80&q=80" class="channel-avatar" alt="Home">
            <span class="channel-label">Home Feed</span>
        </div>

        <div class="divider"></div>
        <div class="sidebar-section-title">Subscriptions</div>

        <div class="nav-item" onclick="showChannel('BAPS Official', 'baps_official', this)">
            <img src="https://images.unsplash.com/photo-1542831371-29b0f74f9713?auto=format&fit=crop&w=80&q=80" class="channel-avatar">
            <span class="channel-label">BAPS Official</span>
        </div>
        <div class="nav-item" onclick="showChannel('BAPS Kirtan', 'baps_kirtan', this)">
            <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=80&q=80" class="channel-avatar">
            <span class="channel-label">BAPS Kirtan</span>
        </div>
        <div class="nav-item" onclick="showChannel('Aksharpith', 'aksharpith', this)">
            <img src="https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=80&q=80" class="channel-avatar">
            <span class="channel-label">Aksharpith</span>
        </div>
        <div class="nav-item" onclick="showChannel('BAPS Satsang (Gujarati)', 'satsang_gujarati', this)">
            <img src="https://images.unsplash.com/photo-1507676184212-d03ab07a01bf?auto=format&fit=crop&w=80&q=80" class="channel-avatar">
            <span class="channel-label">BAPS Satsang (Gujarati)</span>
        </div>
        <div class="nav-item" onclick="showChannel('BAPS Satsang (Hindi)', 'satsang_hindi', this)">
            <img src="https://images.unsplash.com/photo-1507676184212-d03ab07a01bf?auto=format&fit=crop&w=80&q=80" class="channel-avatar">
            <span class="channel-label">BAPS Satsang (Hindi)</span>
        </div>
        <div class="nav-item" onclick="showChannel('BAPS Satsang (English)', 'satsang_english', this)">
            <img src="https://images.unsplash.com/photo-1507676184212-d03ab07a01bf?auto=format&fit=crop&w=80&q=80" class="channel-avatar">
            <span class="channel-label">BAPS Satsang (English)</span>
        </div>
        <div class="nav-item" onclick="showChannel('Akshardham USA', 'akshardham_usa', this)">
            <img src="https://images.unsplash.com/photo-1564507592333-c60657eea523?auto=format&fit=crop&w=80&q=80" class="channel-avatar">
            <span class="channel-label">Akshardham USA</span>
        </div>
    </div>

    <!-- MAIN VIEWPORT -->
    <div class="main-content">
        <header>
            <div class="brand">
                <span>BAPS Media Portal</span>
                <span class="badge">PORTAL</span>
            </div>
        </header>

        <div class="viewport-body">
            <h2 id="view-header" class="page-title">Home Feed</h2>
            <div id="video-grid" class="video-grid"></div>
        </div>
    </div>

    <script>
        // Directly mapped video IDs to prevent Error 153 playlist blocks
        const CHANNEL_VIDEOS = {
            baps_official: [
                { id: "M7lc1UVf-VE", title: "BAPS Swaminarayan Sanstha - Inspiring Faith & Service" },
                { id: "dQw4w9WgXcQ", title: "Special Pravachan and Satsang Assembly" }
            ],
            baps_kirtan: [
                { id: "L_LUpnjgPso", title: "Morning Prayer & Evening Kirtan Aradhana" }
            ],
            aksharpith: [
                { id: "3JZ_D3ELwOQ", title: "Publications and Spiritual Discourse Highlights" }
            ],
            satsang_gujarati: [
                { id: "2Vv-BfVoq4g", title: "Gujarati Satsang Sabha - Latest Session" }
            ],
            satsang_hindi: [
                { id: "fJ9rUzIMcZQ", title: "Hindi Satsang Pravachan - Daily Inspiration" }
            ],
            satsang_english: [
                { id: "kJQP7kiw5Fk", title: "Youth Satsang Assembly in English" }
            ],
            akshardham_usa: [
                { id: "L_LUpnjgPso", title: "BAPS Swaminarayan Akshardham USA Tour" }
            ]
        };

        function buildCardHtml(videoId, title, channelName) {
            return `
                <div class="video-card">
                    <div class="video-embed-container">
                        <iframe 
                            src="https://www.youtube-nocookie.com/embed/${videoId}?rel=0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                        </iframe>
                    </div>
                    <div class="video-details">
                        <div class="video-title">${title}</div>
                        <div class="video-channel">${channelName}</div>
                    </div>
                </div>
            `;
        }

        function showHome(element) {
            setActive(element);
            document.getElementById('view-header').innerText = "Recently Uploaded";
            const grid = document.getElementById('video-grid');
            
            let html = '';
            for (const key in CHANNEL_VIDEOS) {
                const channelName = key.replace('_', ' ').toUpperCase();
                CHANNEL_VIDEOS[key].forEach(v => {
                    html += buildCardHtml(v.id, v.title, channelName);
                });
            }
            grid.innerHTML = html;
        }

        function showChannel(channelName, key, element) {
            setActive(element);
            document.getElementById('view-header').innerText = channelName;
            const grid = document.getElementById('video-grid');
            
            const videos = CHANNEL_VIDEOS[key] || [];
            if (videos.length === 0) {
                grid.innerHTML = '<p style="color: #aaa;">No videos available for this channel.</p>';
                return;
            }

            grid.innerHTML = videos.map(v => buildCardHtml(v.id, v.title, channelName)).join('');
        }

        function setActive(element) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if (element) element.classList.add('active');
        }

        // Initialize Home view
        window.onload = function() {
            showHome(document.querySelector('.nav-item'));
        };
    </script>
</body>
</html>
